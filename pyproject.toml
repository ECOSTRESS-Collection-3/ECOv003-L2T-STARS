[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ECOv003-L2T-STARS"
version = "1.19.0"
description = "ECOSTRESS Collection 3 Level-2 Tiled STARS NDVI and Albedo Product Generating Executable"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gregory H. Halverson", email = "gregory.h.halverson@jpl.nasa.gov" },
    { name = "Margaret Johnson", email = "maggie.johnson@jpl.nasa.gov" },
]
dependencies = [
    "colored_logging~=1.1.0",
    "ECOv002-CMR",
    "ECOv002-granules",
    "ECOv003-exit-codes~=1.2.0",
    "ECOv003-granules",
    "earthaccess",
    "GEOS5FP~=2.24.0",
    "h5py",
    "harmonized-landsat-sentinel",
    "matplotlib",
    "modland~=1.2.0",
    "numpy",
    "pandas",
    "pytictoc",
    "rasters",
    "scikit-image",
    "scipy",
    "sentinel-tiles~=1.1.1",
    "shapely~=2.2.0",
    "untangle~=1.3.0",
    "VCD43NRT~=1.5.0",
    "xmltodict~=1.0.4",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=8.0",
    "pytest-cov",
    "rasterio",
]

[project.scripts]
ECOv003-L2T-STARS = "ECOv003_L2T_STARS.main:main"
ECOv003-DL = "ECOv003_L2T_STARS.ECOv003_DL:main"
ECOv003-L2T-STARS-install-julia = "ECOv003_L2T_STARS.julia_environment:main"

[tool.maturin]
module-name = "ECOv003_L2T_STARS._stars_rust"
python-source = "."
include = [
    "ECOv003_L2T_STARS/*.jl",
    "ECOv003_L2T_STARS/*.toml",
    "ECOv003_L2T_STARS/*.xml",
    "ECOv003_L2T_STARS/*.pyi",
]

[tool.pytest.ini_options]
testpaths = ["tests"]