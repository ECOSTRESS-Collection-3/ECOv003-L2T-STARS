name: CI

on:
  push:
    branches: ["main", "rust"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Create virtual environment and install build tools
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          .venv/bin/python -m pip install --upgrade pip "maturin>=1.8,<2"

      - name: Check Rust formatting, clippy, and unit tests
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release

      - name: Build and install editable package with dev extras
        run: python -m maturin develop --release --extras dev

      - name: Run pytest suite
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          SKIP_EARTHDATA_LOGIN: "true"
        run: PYTHONPATH=. pytest

      - name: Verify isolated wheel installation
        run: |
          python -m maturin build --release --out dist
          python -m venv /tmp/wheel-test-env
          /tmp/wheel-test-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-test-env/bin/python -I -m ECOv003_L2T_STARS.smoke_test